version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: affiliate-postgres-dev
    environment:
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: affiliate_password
      POSTGRES_DB: affiliate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-network

volumes:
  postgres_data_dev:
    driver: local

networks:
  affiliate-network:
    driver: bridge