services:
  - type: web
    name: affiliate-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: API_PORT
        value: 3001
      - key: SHOPEE_WEBHOOK_SECRET
        sync: false
      - key: TIKTOK_WEBHOOK_SECRET
        sync: false
      - key: SUPER_ADMIN_PHONE_NUMBER
        sync: false
      - key: SUPER_ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: SHOPEE_COMMISSION_RATE
        value: 5.0
      - key: TIKTOK_COMMISSION_RATE
        value: 4.5
      - key: MIN_WITHDRAWAL_AMOUNT
        value: 50000
      - key: MAX_WITHDRAWAL_AMOUNT
        value: 10000000
      - key: WITHDRAWAL_FEE_PERCENT
        value: 0
      - key: WITHDRAWAL_PROCESSING_HOURS
        value: 24
